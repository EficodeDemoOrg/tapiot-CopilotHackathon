<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🔧 Auto Parts Shop</h1>
        <div id="cart-icon" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <div id="search-bar">
        <input type="text" id="search-input" placeholder="Search parts by name, description, manufacturer..." oninput="debounceSearch()">
        <div id="price-filter">
            <label>Price: $<span id="min-label">0</span> - $<span id="max-label">500</span></label>
            <input type="range" id="min-price" min="0" max="500" value="0" oninput="updatePriceLabel(); debounceSearch()">
            <input type="range" id="max-price" min="0" max="500" value="500" oninput="updatePriceLabel(); debounceSearch()">
        </div>
    </div>

    <main>
        <div id="product-list"></div>
        <div id="product-detail" class="hidden"></div>
    </main>

    <div id="cart-panel" class="hidden">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
        <div id="cart-total">Total: $0.00</div>
        <button onclick="toggleCart()">Close</button>
    </div>

    <div id="overlay" class="hidden" onclick="toggleCart()"></div>

    <script src="app.js"></script>
</body>
</html>
