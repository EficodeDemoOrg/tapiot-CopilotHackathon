<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; }

        /* Login */
        #login-screen {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .login-box {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 2.5rem; text-align: center; width: 380px;
        }
        .login-box h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
        .login-box p { color: #aaa; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .login-box input {
            width: 100%; padding: 0.8rem 1rem; border: 2px solid #333; background: #0f0f23;
            color: white; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; outline: none;
        }
        .login-box input:focus { border-color: #e94560; }
        .login-box button {
            width: 100%; padding: 0.8rem; background: #e94560; color: white; border: none;
            border-radius: 8px; font-size: 1rem; cursor: pointer; margin-bottom: 0.8rem;
        }
        .login-box button:hover { background: #c73652; }
        .login-box .random-btn { background: #16213e; border: 1px solid #333; }
        .login-box .random-btn:hover { background: #1a2940; }

        /* Chat layout */
        #chat-screen { display: none; width: 100%; height: 100vh; }
        #chat-screen.active { display: flex; }

        /* Sidebar */
        #sidebar {
            width: 240px; background: #0f0f23; border-right: 1px solid #222;
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        #sidebar h3 { padding: 1rem; border-bottom: 1px solid #222; font-size: 0.95rem; color: #aaa; }
        #user-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .user-item {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.8rem;
            border-radius: 8px; margin-bottom: 2px;
        }
        .user-item img { width: 32px; height: 32px; border-radius: 50%; }
        .user-item .user-name { font-size: 0.9rem; }

        /* Main chat */
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #chat-header {
            padding: 0.8rem 1.2rem; background: #16213e; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }
        #chat-header h2 { font-size: 1.1rem; }
        #chat-header .user-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: #aaa; }
        #chat-header .user-info img { width: 28px; height: 28px; border-radius: 50%; }

        /* Messages */
        #messages {
            flex: 1; overflow-y: auto; padding: 1rem 1.2rem;
            display: flex; flex-direction: column; gap: 0.6rem;
        }
        .msg { max-width: 70%; padding: 0.6rem 1rem; border-radius: 12px; word-wrap: break-word; }
        .msg-other { background: #16213e; align-self: flex-start; }
        .msg-self { background: #e94560; align-self: flex-end; }
        .msg-system {
            align-self: center; background: none; color: #666; font-size: 0.8rem;
            font-style: italic; padding: 0.3rem;
        }
        .msg .msg-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
        .msg .msg-header img { width: 20px; height: 20px; border-radius: 50%; }
        .msg .msg-header .msg-nick { font-weight: bold; font-size: 0.8rem; color: #e94560; }
        .msg-self .msg-header .msg-nick { color: #ffcdd2; }
        .msg .msg-time { font-size: 0.7rem; color: #888; margin-top: 0.2rem; }
        .msg .msg-text { font-size: 0.95rem; line-height: 1.4; }
        .msg .msg-image { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 0.3rem; }

        /* Input */
        #input-bar {
            padding: 0.8rem 1.2rem; background: #0f0f23; border-top: 1px solid #222;
            display: flex; gap: 0.5rem;
        }
        #input-bar input {
            flex: 1; padding: 0.7rem 1rem; background: #1a1a2e; border: 1px solid #333;
            color: white; border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        #input-bar input:focus { border-color: #e94560; }
        #input-bar button {
            padding: 0.7rem 1.2rem; background: #e94560; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-size: 0.95rem;
        }
        #input-bar button:hover { background: #c73652; }
        #img-btn { background: #16213e; border: 1px solid #333 !important; }
        #img-btn:hover { background: #1a2940 !important; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h1>💬 WebSocket Chat</h1>
            <p>Enter a nickname or get a random identity</p>
            <input type="text" id="nickname-input" placeholder="Your nickname..." maxlength="30" autofocus>
            <button onclick="joinWithNickname()">Join Chat</button>
            <button class="random-btn" onclick="joinAsRandom()">🎲 Random Identity</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div id="sidebar">
            <h3>Online Users (<span id="user-count">0</span>)</h3>
            <div id="user-list"></div>
        </div>
        <div id="chat-main">
            <div id="chat-header">
                <h2>Chat Room</h2>
                <div class="user-info">
                    <img id="my-avatar" src="" alt="">
                    <span id="my-nickname"></span>
                </div>
            </div>
            <div id="messages"></div>
            <div id="input-bar">
                <input type="text" id="msg-input" placeholder="Type a message..." maxlength="1000" autocomplete="off">
                <button id="img-btn" onclick="sendImage()">🖼️</button>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let currentUser = { nickname: '', avatar: '' };
        const defaultAvatar = 'https://ui-avatars.com/api/?background=e94560&color=fff&name=';

        // Session restore
        const saved = localStorage.getItem('chat_user');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                document.getElementById('nickname-input').value = parsed.nickname || '';
            } catch {}
        }

        // Login handlers
        function joinWithNickname() {
            const nick = document.getElementById('nickname-input').value.trim();
            if (!nick) return;
            currentUser = { nickname: nick, avatar: defaultAvatar + encodeURIComponent(nick) };
            connectChat();
        }

        async function joinAsRandom() {
            try {
                const res = await fetch('https://randomuser.me/api/?results=1');
                const data = await res.json();
                const user = data.results[0];
                currentUser = {
                    nickname: `${user.name.first} ${user.name.last}`,
                    avatar: user.picture.thumbnail
                };
            } catch {
                currentUser = {
                    nickname: 'User_' + Math.floor(Math.random() * 9999),
                    avatar: defaultAvatar + 'Random'
                };
            }
            connectChat();
        }

        function connectChat() {
            // Save session
            localStorage.setItem('chat_user', JSON.stringify(currentUser));

            // Update UI
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').classList.add('active');
            document.getElementById('my-nickname').textContent = currentUser.nickname;
            document.getElementById('my-avatar').src = currentUser.avatar;

            // Connect socket
            socket = io();

            socket.on('connect', () => {
                socket.emit('user join', currentUser);
            });

            socket.on('message history', (messages) => {
                messages.forEach(msg => appendMessage(msg));
                scrollToBottom();
            });

            socket.on('chat message', (msg) => {
                appendMessage(msg);
                scrollToBottom();
            });

            socket.on('user list', (users) => {
                renderUserList(users);
            });

            // Enter to send
            document.getElementById('msg-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            document.getElementById('msg-input').focus();
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !socket) return;
            socket.emit('chat message', { text });
            input.value = '';
            input.focus();
        }

        function sendImage() {
            const url = prompt('Enter image URL:');
            if (!url || !socket) return;
            try {
                const parsed = new URL(url);
                if (!['http:', 'https:'].includes(parsed.protocol)) return;
            } catch { return; }
            socket.emit('image message', { imageUrl: url });
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const el = document.createElement('div');
            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (msg.type === 'system') {
                el.className = 'msg msg-system';
                el.textContent = `${msg.text} · ${time}`;
            } else {
                const isSelf = msg.nickname === currentUser.nickname;
                el.className = `msg ${isSelf ? 'msg-self' : 'msg-other'}`;

                let content = '';
                if (!isSelf) {
                    content += `<div class="msg-header"><img src="${escapeAttr(msg.avatar)}" alt=""><span class="msg-nick">${escapeHtml(msg.nickname)}</span></div>`;
                }
                if (msg.type === 'image') {
                    content += `<img class="msg-image" src="${escapeAttr(msg.imageUrl)}" alt="shared image" loading="lazy">`;
                } else {
                    content += `<div class="msg-text">${escapeHtml(msg.text)}</div>`;
                }
                content += `<div class="msg-time">${time}</div>`;
                el.innerHTML = content;
            }

            container.appendChild(el);
        }

        function renderUserList(users) {
            const list = document.getElementById('user-list');
            document.getElementById('user-count').textContent = users.length;
            list.innerHTML = users.map(u => `
                <div class="user-item">
                    <img src="${escapeAttr(u.avatar)}" alt="">
                    <span class="user-name">${escapeHtml(u.nickname)}</span>
                </div>
            `).join('');
        }

        function scrollToBottom() {
            const msgs = document.getElementById('messages');
            msgs.scrollTop = msgs.scrollHeight;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }
        function escapeAttr(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }
    </script>
</body>
</html>
